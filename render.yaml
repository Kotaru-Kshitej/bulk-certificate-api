# Render Blueprint (FREE plan) — https://render.com/docs/blueprint-spec
# Note: on the free plan the filesystem is wiped on restart/redeploy/sleep,
# so jobs and generated certificates are temporary. Fine for demos.
services:
  - type: web
    name: bulk-certificate-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # Keep ONE worker: the background job thread + SQLite must live in a single process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3s